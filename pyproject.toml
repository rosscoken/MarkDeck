[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdeck"
version = "0.1.0"
description = "A sophisticated command-line tool that converts Markdown files into professional PowerPoint presentations"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ross", email = "ross@example.com"},
]
maintainers = [
    {name = "Ross", email = "ross@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]
keywords = [
    "markdown",
    "powerpoint",
    "presentation",
    "slides",
    "converter",
    "pptx",
    "pandoc",
    "cli",
]
requires-python = ">=3.8"
dependencies = [
    "pandoc>=3.0.0",
    "python-pptx>=0.6.21",
    "jsonschema>=4.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
    "toml>=0.10.0",
    "python-docx2pdf>=0.1.8",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
]
pdf = [
    "unoconv>=0.9.0",
]
visual = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]
all = [
    "markdeck[dev,docs,pdf,visual]",
]

[project.urls]
Homepage = "https://github.com/rtcok/markdeck"
Documentation = "https://markdeck.readthedocs.io"
Repository = "https://github.com/rtcok/markdeck.git"
"Bug Tracker" = "https://github.com/rtcok/markdeck/issues"
Changelog = "https://github.com/rtcok/markdeck/blob/main/CHANGELOG.md"

[project.scripts]
markdeck = "markdeck.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markdeck*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
markdeck = [
    "themes/defaults/*.json",
    "schemas/*.json",
    "config/defaults.py",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pandoc.*",
    "pptx.*",
    "docx2pdf.*",
    "cv2.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=markdeck",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "golden: marks tests as golden file tests",
    "visual: marks tests as visual regression tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["markdeck"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]